name: Bug report
description: Something in the app behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Switch to the Client 1 profile
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: From package.json, or the release you installed.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the terminal, or from DevTools (View → Toggle Developer Tools).
      render: shell
